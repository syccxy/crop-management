# 服务端口
server:
  port: 8080

spring:
  application:
    name: crop-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

mybatis-plus:
  configuration:
    # SQL 日志（开发环境开启，便于观察动态 SQL 拼接效果）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 实体类使用下划线字段自动映射（开启驼峰转换）
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除：1 已删除，0 未删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.agri: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"
